apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: shorty

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shorty

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60